[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-graph"
version = "0.1.0"
description = "Version specifications as nodes and change intent as directed hyperedges."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
spec-graph = "spec_graph.cli:main"

[tool.setuptools]
packages = ["spec_graph"]

[tool.setuptools.package-data]
spec_graph = ["assets/*", "assets/atomizer/*"]
