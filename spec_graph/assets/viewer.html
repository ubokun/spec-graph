<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spec-Graph · Explorer</title>
<link rel="stylesheet" href="/assets/viewer.css">
<script defer src="/assets/cytoscape.min.js"></script>
<script defer src="/assets/cytoscape-dagre.min.js"></script>
<script defer src="/assets/graph-model.js"></script>
<script defer src="/assets/viewer.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="brand-icon">⋈</span><div><h1>Spec-Graph <span>EXPLORER</span></h1><p id="repo">グラフを読み込み中…</p></div></div>
  <div class="toolbar"><label for="filter" class="sr-only">Intentの表示対象</label><select id="filter"><option value="all">すべてのIntent</option><option value="applied">適用済み</option><option value="planned">計画・予想</option></select><button id="refresh">↻ 更新</button></div>
</header>
<div class="summary"><span id="counts" aria-live="polite"></span><div class="legend"><span><i class="current"></i>現在</span><span><i class="past"></i>過去</span><span><i class="proposal"></i>候補</span><span><i class="diamond"></i>Intent</span><span>┄ 予想・計画</span></div></div>
<p id="error" role="alert" hidden></p>
<main>
  <section class="canvas-area" aria-label="仕様グラフ">
    <div class="canvas-heading"><strong>仕様のつながり</strong><span>過去 → 現在 → 予想</span></div>
    <div id="graph" role="img" aria-label="SpecとIntentの有向グラフ。詳細は右側のノード一覧からも選択できます。"></div>
    <p id="empty" hidden>この条件に一致するIntentはありません。</p>
    <div class="canvas-bottom"><span>ドラッグで移動 · ホイールでズーム · 点を選択して詳細</span><div class="controls"><button id="zoom-out" aria-label="縮小">−</button><output id="zoom" aria-label="拡大率">100%</output><button id="zoom-in" aria-label="拡大">＋</button><button id="fit">全体表示</button><button id="layout">再配置</button></div></div>
  </section>
  <aside aria-label="グラフの詳細">
    <section id="details" aria-live="polite"></section>
    <section class="browser"><div class="section-heading">ノードを探す <span id="result-count"></span></div><label for="search" class="sr-only">ID・仕様・意図を検索</label><input id="search" type="search" placeholder="ID・仕様・意図を検索" autocomplete="off"><div id="node-list"></div></section>
  </aside>
</main>
<footer>ローカルで表示 · 仕様データの編集はCLIから <a href="/assets/THIRD_PARTY_LICENSES.txt" target="_blank" rel="noopener">Cytoscape.js / Dagre licenses</a></footer>
</body></html>
